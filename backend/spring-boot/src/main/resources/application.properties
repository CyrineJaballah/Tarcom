server.port=${PORT:8080}
server.servlet.context-path=${BASE_ROUTE:/api}
server.servlet.session.timeout=30m

spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tarcom}
spring.data.mongodb.auto-index-creation=${MONGODB_CREATION:true}
spring.data.mongodb.gridfs-bucket=fs

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

spring.jackson.serialization.write-dates-as-timestamps=${TIMESTAMPS:false}
spring.jackson.time-zone=${TIME_ZONE:UTC}

logging.level.org.springframework=${SPRING_LOGGING_LEVEL:INFO}
logging.level.com.tarcom=${APP_LOGGING_LEVEL:DEBUG}

# CORS Configuration
cors.allowed-origins=${cors.allowed-origins:http://localhost:3000}

# Embedded Tomcat Configuration for large uploads
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=60000
